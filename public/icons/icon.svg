<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fooddropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#fooddropGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Utensils / Fork & Spoon / Delivery Icon -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 106) scale(1.25)">
    <!-- Plate / Ring -->
    <circle cx="120" cy="120" r="100" stroke="#ffffff" stroke-opacity="0.4" stroke-width="12" stroke-dasharray="16 12" />
    
    <!-- Fork -->
    <path d="M70 45 v60 a25 25 0 0 0 25 25 v70 a10 10 0 0 0 20 0 v-70 a25 25 0 0 0 25 -25 v-60" stroke="#ffffff" stroke-width="22" />
    <path d="M95 45 v45" stroke="#ffffff" stroke-width="20" />
    <path d="M120 45 v45" stroke="#ffffff" stroke-width="20" />
    
    <!-- Spoon / Knife Sparkle -->
    <path d="M165 45 c-15 0 -25 25 -25 55 c0 25 15 35 25 35 v65 a10 10 0 0 0 20 0 v-65 c10 0 25 -10 25 -35 c0 -30 -10 -55 -25 -55 z" fill="#ffffff" fill-opacity="0.9" />
  </g>
</svg>
